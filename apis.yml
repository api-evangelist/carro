description: 'Carro is a Singapore-headquartered used-car marketplace and automotive fintech platform,
  founded in 2015 and widely described as Southeast Asia''s largest online used-car retailer. It operates
  a data-driven marketplace for buying and selling pre-owned vehicles across Singapore, Indonesia, Thailand,
  Malaysia and Japan, and pairs it with adjacent services: car financing (Genie Financial Services), motor
  insurance, aftersales servicing and workshops (Carro Care), and car subscription. Carro reached unicorn
  status in 2021 in a round led by SoftBank Vision Fund 2. It was added to the API Evangelist network as
  a portfolio company of SoftBank Vision Fund; as of this pass Carro publishes no public developer portal,
  API documentation, or machine-readable API definition, so this profile is company-identity only.'
